<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Customer Satisfaction Survey</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 40px 20px;
      background: #f4f6f8;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="600"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="background: #ffffff; border-radius: 10px; padding: 40px"
          >
            <tr>
              <td align="center">
                <h2
                  style="
                    margin: 0;
                    color: #222;
                    font-size: 28px;
                    font-weight: bold;
                  "
                >
                  How satisfied are you with our support?
                </h2>

                <p
                  style="
                    margin: 18px 0 35px;
                    color: #666;
                    font-size: 16px;
                    line-height: 24px;
                  "
                >
                  We'd love to hear about your experience.<br />
                  Your feedback helps us improve our service.
                </p>

                <table
                  role="presentation"
                  cellspacing="0"
                  cellpadding="0"
                  border="0"
                >
                  <tr>
                    <td align="center" style="padding: 0 18px">
                      <a
                        href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=N-0b_WRuKUCUri0p76P1ciMCgbEyRTZKn1onILstHuFUQ05TRklETVcyTU1GTDhHM0k5UFJNQ1E0Ry4u&r60cac473dc574a958ebc29c79cacff20=%22Disappointed%22"
                        style="text-decoration: none; font-size: 52px"
                      >
                        🙁
                      </a>
                      <div
                        style="font-size: 13px; color: #666; margin-top: 10px"
                      >
                        Disappointed
                      </div>
                    </td>

                    <td align="center" style="padding: 0 18px">
                      <a
                        href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=N-0b_WRuKUCUri0p76P1ciMCgbEyRTZKn1onILstHuFUQ05TRklETVcyTU1GTDhHM0k5UFJNQ1E0Ry4u&r60cac473dc574a958ebc29c79cacff20=%22Neutral%22"
                        style="text-decoration: none; font-size: 52px"
                      >
                        🙂
                      </a>
                      <div
                        style="font-size: 13px; color: #666; margin-top: 10px"
                      >
                        Neutral
                      </div>
                    </td>

                    <td align="center" style="padding: 0 18px">
                      <a
                        href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=N-0b_WRuKUCUri0p76P1ciMCgbEyRTZKn1onILstHuFUQ05TRklETVcyTU1GTDhHM0k5UFJNQ1E0Ry4u&r60cac473dc574a958ebc29c79cacff20=%22Satisfied%22"
                        style="text-decoration: none; font-size: 52px"
                      >
                        😃
                      </a>
                      <div
                        style="font-size: 13px; color: #666; margin-top: 10px"
                      >
                        Satisfied
                      </div>
                    </td>
                  </tr>
                </table>

                <p
                  style="
                    margin-top: 40px;
                    font-size: 13px;
                    color: #999;
                    line-height: 20px;
                  "
                >
                  This survey takes less than a minute to complete.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
